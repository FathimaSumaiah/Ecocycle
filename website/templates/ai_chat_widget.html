<!-- [AI-CHATBOT] EcoBot Chat Widget — delete this file to undo -->
<!-- Trigger button (bottom-right floating) -->
<button id="ecobot-fab" title="Ask EcoBot AI" onclick="ecobotToggle()"
  style="position:fixed;bottom:28px;right:28px;z-index:9999;
         width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
         background:linear-gradient(135deg,#1A3C34,#2E7D52);
         color:#fff;font-size:24px;box-shadow:0 4px 18px rgba(0,0,0,0.25);
         display:flex;align-items:center;justify-content:center;transition:transform .2s;">
  🤖
</button>

<!-- Chat panel -->
<div id="ecobot-panel"
  style="display:none;position:fixed;bottom:96px;right:28px;z-index:9998;
         width:360px;height:500px;border-radius:18px;overflow:hidden;
         background:#fff;box-shadow:0 8px 40px rgba(0,0,0,0.18);
         display:none;flex-direction:column;font-family:'Inter',sans-serif;">

  <!-- Header -->
  <div style="background:linear-gradient(135deg,#1A3C34,#2E7D52);
              padding:14px 18px;display:flex;align-items:center;gap:10px;">
    <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);
                display:flex;align-items:center;justify-content:center;font-size:18px;">🌿</div>
    <div>
      <div style="color:#fff;font-weight:600;font-size:14px;">EcoBot</div>
      <div style="color:rgba(255,255,255,0.7);font-size:11px;">AI-powered dashboard assistant</div>
    </div>
    <button onclick="ecobotToggle()"
      style="margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.8;">✕</button>
  </div>

  <!-- Messages -->
  <div id="ecobot-messages"
    style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
           background:#F8FAF9;">
    <div class="ecobot-msg bot" style="align-self:flex-start;max-width:85%;">
      <div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px 12px 12px 3px;
                  padding:10px 13px;font-size:13px;color:#1A3C34;line-height:1.5;
                  box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        👋 Hi! I'm EcoBot. Ask me anything about today's pickups, worker performance, ward stats, waste data, or feedbacks.
      </div>
    </div>
  </div>

  <!-- Input area -->
  <div style="padding:12px;border-top:1px solid #E5E7EB;background:#fff;display:flex;gap:8px;">
    <input id="ecobot-input" type="text" placeholder="e.g. Which ward has most pending pickups?"
      onkeydown="if(event.key==='Enter')ecobotSend()"
      style="flex:1;border:1.5px solid #D1D5DB;border-radius:10px;padding:9px 12px;
             font-size:13px;outline:none;font-family:inherit;transition:border .2s;"
      onfocus="this.style.borderColor='#2E7D52'" onblur="this.style.borderColor='#D1D5DB'">
    <button onclick="ecobotSend()"
      style="width:40px;height:40px;border-radius:10px;border:none;cursor:pointer;
             background:linear-gradient(135deg,#1A3C34,#2E7D52);color:#fff;font-size:16px;
             display:flex;align-items:center;justify-content:center;flex-shrink:0;">➤</button>
  </div>
</div>

<style>
  #ecobot-fab:hover { transform: scale(1.08); }
  #ecobot-messages::-webkit-scrollbar { width: 4px; }
  #ecobot-messages::-webkit-scrollbar-track { background: transparent; }
  #ecobot-messages::-webkit-scrollbar-thumb { background: #C8D8D1; border-radius: 4px; }
  .ecobot-typing span {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:#1A3C34; animation: ecobotBounce 1.2s infinite;
  }
  .ecobot-typing span:nth-child(2) { animation-delay:.2s; }
  .ecobot-typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes ecobotBounce {
    0%,60%,100% { transform:translateY(0); }
    30%          { transform:translateY(-6px); }
  }
</style>

<script>
  let _ecobotOpen = false;

  function ecobotToggle() {
    _ecobotOpen = !_ecobotOpen;
    const panel = document.getElementById('ecobot-panel');
    panel.style.display = _ecobotOpen ? 'flex' : 'none';
    if (_ecobotOpen) document.getElementById('ecobot-input').focus();
  }

  function ecobotAddMsg(text, role) {
    const box = document.getElementById('ecobot-messages');
    const wrap = document.createElement('div');
    wrap.style.cssText = role === 'user'
      ? 'align-self:flex-end;max-width:85%;'
      : 'align-self:flex-start;max-width:85%;';

    const bubble = document.createElement('div');
    bubble.style.cssText = role === 'user'
      ? 'background:linear-gradient(135deg,#1A3C34,#2E7D52);color:#fff;border-radius:12px 12px 3px 12px;padding:10px 13px;font-size:13px;line-height:1.5;'
      : 'background:#fff;border:1px solid #E5E7EB;border-radius:12px 12px 12px 3px;padding:10px 13px;font-size:13px;color:#1A3C34;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.06);white-space:pre-wrap;';

    // Convert markdown-ish bold **text** to <strong>
    bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    wrap.appendChild(bubble);
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    return wrap;
  }

  function ecobotTyping() {
    const box = document.getElementById('ecobot-messages');
    const wrap = document.createElement('div');
    wrap.style.cssText = 'align-self:flex-start;';
    wrap.innerHTML = `<div style="background:#fff;border:1px solid #E5E7EB;border-radius:12px 12px 12px 3px;
      padding:12px 16px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06);"
      class="ecobot-typing"><span></span><span></span><span></span></div>`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    return wrap;
  }

  async function ecobotSend() {
    const inp = document.getElementById('ecobot-input');
    const msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';

    ecobotAddMsg(msg, 'user');
    const loader = ecobotTyping();

    try {
      const res = await fetch('/admin/ai_chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      loader.remove();
      ecobotAddMsg(data.reply || data.error || 'Something went wrong.', 'bot');
    } catch (e) {
      loader.remove();
      ecobotAddMsg('Network error. Please try again.', 'bot');
    }
  }
</script>
