<!DOCTYPE html>
<html>
<head><title>View Document</title>
<style>
 body{font-family:Arial,sans-serif; text-align:center; background:#f5f5f5; padding:30px;}
 img{width:450px; height:650px; object-fit:contain; border:2px solid #ccc; border-radius:10px; background:white; margin-top:20px;}
.back-btn{position:absolute; top:20px; left:20px; padding:10px 18px; background:#1B5E20; color:white; text-decoration:none; border-radius:6px; font-weight:bold;}
</style>
</head>
<body>
<a href="javascript:history.back()" class="back-btn">← Back</a>
<h2>Document Verification</h2>
<img src="{{ url_for('static', filename=filename) }}">
<p style="color:#666; font-size:12px; margin-top:10px;">{{ filename }}</p>
</body>
</html>
